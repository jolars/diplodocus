version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    # RcDom 0.39 requires this release line; revisit when RcDom is updated.
    ignore:
      - dependency-name: "html5ever"
        versions: [">=0.40"]
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"
