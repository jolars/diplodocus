name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration-1, integration-2, integration-3, integration-4, snapshots]
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Build devenv shell
        run: devenv shell -- true
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.suite }}
      - name: Run unit tests
        if: matrix.suite == 'unit'
        run: devenv shell -- cargo test --locked --lib --bins --examples --benches
      - name: Run integration shard
        if: startsWith(matrix.suite, 'integration-')
        run: devenv shell -- python scripts/test-integration-shard.py "${{ matrix.suite }}"
      - name: Check snapshot fingerprints with insertion-ordered JSON maps
        if: matrix.suite == 'snapshots'
        run: devenv shell -- cargo test --locked --features serde_json/preserve_order --test snapshot_canonical

  python-sphinx:
    name: Sphinx ${{ matrix.sphinx }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            sphinx: '9.0.4'
          - python: '3.14'
            sphinx: '9.1.1'
          - python: '3.14'
            sphinx: '9.2.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'sphinx==${{ matrix.sphinx }}'
      - run: python scripts/test-python-compat.py --profile '${{ matrix.sphinx }}=python'

  julia-native:
    name: Julia ${{ matrix.julia }} native extraction
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1.11', '1.12', '1.13']
    env:
      JULIA_LOAD_PATH: '@:@stdlib'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: Swatinem/rust-cache@v2
      - run: julia --startup-file=no --history-file=no tests/julia_runtime.jl
      - run: cargo test --locked --test native_adapter_contract generated_julia_methods_are_discovered_and_doctests_run_only_during_extraction

  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser
      - name: Install browser tooling
        run: devenv shell -- npm ci --ignore-scripts
      - name: Test Markdown negotiation in Workers
        run: devenv shell -- node --test scripts/markdown-worker.test.mjs
      - name: Test and capture the example site
        run: devenv shell -- site-capture
      - name: Test watched extraction with VitePress
        run: devenv shell -- npm run vitepress-test
      - name: Upload browser reports, screenshots, and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-artifacts
          path: |
            artifacts/browser/
            artifacts/vitepress/
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - run: cargo doc --locked --no-deps

  versionary:
    name: versionary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, clippy, test, python-sphinx, julia-native, browser, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - id: versionary
        uses: jolars/versionary@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
