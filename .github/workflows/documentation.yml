name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Build devenv shell
        run: devenv shell -- true
      - uses: Swatinem/rust-cache@v2
        with:
          key: documentation
      - name: Check the project site
        run: devenv shell -- cargo test --locked --test project_site
      - name: Check source documentation
        run: devenv shell -- cargo run --locked -- check
      - name: Build the deployable site
        run: devenv shell -- cargo run --locked -- build --output site/docs
      - name: Add Diplodocus site icons
        run: |
          cp assets/brand/favicon.ico site/docs/favicon.ico
          cp assets/brand/favicon.svg site/docs/favicon.svg
          cp assets/brand/apple-touch-icon.png site/docs/apple-touch-icon.png
      - name: Install deployment dependencies
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: devenv shell -- npm ci --ignore-scripts
      - name: Deploy to Cloudflare Workers
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: devenv shell -- npx --no-install wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
