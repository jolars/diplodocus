<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="64" height="64" viewBox="0 0 64 64"
     role="img" aria-labelledby="title description">
  <title id="title">Diplodocus favicon</title>
  <desc id="description">A dinosaur writes in an open book.</desc>
  <g inkscape:groupmode="layer" inkscape:label="Background" id="background">
    <rect x="0" y="0" width="64" height="64" rx="12" fill="#202c38"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Book" id="book">
    <path id="pages" fill="#fafbf9"
          d="M 6,46 Q 17,41 31,49 Q 45,41 58,46 L 58,57 Q 45,53 32,60 Q 19,53 6,57 Z"/>
    <path id="spine" fill="none" stroke="#202c38" stroke-width="2.5" stroke-linecap="round"
          d="M 31,49 L 32,60"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Dinosaur" id="dinosaur">
    <path id="neck-and-head" fill="#688b84"
          d="M 20,39 Q 17,31 19,22 Q 22,9 34,8 Q 45,7 49,19 Q 52,27 47,36 L 42,38 Q 45,27 40,19 Q 36,12 29,17 Q 23,22 26,33 Q 30,39 27,43 Q 24,47 18,45 Q 14,43 16,39 Z"/>
    <path id="head" fill="#688b84"
          d="M 20,32 C 14,31 11,36 12,42 C 12,48 19,50 25,47 C 31,44 31,38 26,34 C 24,33 22,32 20,32 Z"/>
    <circle id="eye" cx="17.5" cy="39" r="1.7" fill="#202c38"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Pencil" id="pencil">
    <path id="shaft" fill="#a04605" d="M 26,42 L 29,44 L 23,52 L 20,50 Z"/>
    <path id="tip" fill="#202c38" d="M 20,50 L 23,52 L 19,55 Z"/>
  </g>
</svg>
