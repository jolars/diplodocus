project:
  name: "Diplodocus"
presentation:
  description: "Guides for building Python, R, Julia, Rust, and C++ documentation with Diplodocus."
  site-url: "https://diplodocus.cc/"
  canonical-url-style: "clean"
  redirects:
    /authoring: "guide/authoring.html"
    /authoring.html: "guide/authoring.html"
    /configuration: "guide/configuration.html"
    /configuration.html: "guide/configuration.html"
    /diagnostics: "guide/diagnostics.html"
    /diagnostics.html: "guide/diagnostics.html"
    /execution: "guide/execution.html"
    /execution.html: "guide/execution.html"
    /extraction: "guide/extraction.html"
    /extraction.html: "guide/extraction.html"
    /installation: "guide/installation.html"
    /installation.html: "guide/installation.html"
    /quick-start: "guide/quick-start.html"
    /quick-start.html: "guide/quick-start.html"
    /snapshots: "guide/snapshots.html"
    /snapshots.html: "guide/snapshots.html"
    /cli: "reference/cli.html"
    /cli.html: "reference/cli.html"
    /guide/cli: "reference/cli.html"
    /guide/cli.html: "reference/cli.html"
  sections:
    - label: "Reference"
      path: "reference/index.html"
  sidebar:
    /:
      - text: "Introduction"
        items:
          - text: "Overview"
            link: "guide/index.html"
          - text: "Getting started"
            link: "guide/quick-start.html"
          - text: "Installation"
            link: "guide/installation.html"
      - text: "Authoring"
        items:
          - text: "Configuration"
            link: "guide/configuration.html"
          - text: "Writing pages"
            link: "guide/authoring.html"
          - text: "Navigation"
            link: "guide/navigation.html"
          - text: "Site appearance"
            link: "guide/presentation.html"
          - text: "Executable examples"
            link: "guide/execution.html"
          - text: "R Markdown"
            link: "guide/authoring/rmarkdown.html"
          - text: "Julia Documenter"
            link: "guide/authoring/documenter.html"
      - text: "Extraction"
        items:
          - text: "Overview"
            link: "guide/extraction.html"
          - text: "Python"
            link: "guide/extraction/python.html"
          - text: "R"
            link: "guide/extraction/r.html"
          - text: "Julia"
            link: "guide/extraction/julia.html"
          - text: "Rust"
            link: "guide/extraction/rust.html"
      - text: "Advanced"
        collapsed: true
        items:
          - text: "Troubleshooting"
            link: "guide/diagnostics.html"
          - text: "Portable snapshots"
            link: "guide/snapshots.html"
          - text: "Browser components"
            link: "guide/authoring/components.html"
    /reference/:
      - text: "Reference"
        items:
          - text: "Overview"
            link: "reference/index.html"
          - text: "CLI Reference"
            link: "reference/cli.html"
          - text: "Configuration"
            link: "reference/configuration.html"
          - text: "Changelog"
            link: "reference/CHANGELOG.html"
          - text: "Contributing"
            link: "reference/CONTRIBUTING.html"
  home:
    tagline: "One home for all your package docs."
    description: "Bring your Python, R, Julia, Rust, and C++ packages together. Build API references and guides with shared navigation, cross-references, and search."
    guide: "guide/index.html"
    actions:
      - label: "Get started"
        path: "guide/quick-start.html"
      - label: "Explore the guide"
        path: "guide/index.html"
    features:
      - title: "Five languages, one home"
        description: "Keep related packages together, with API references extracted from Python, R, Julia, Rust, and C++."
        path: "guide/extraction.html"
      - title: "Write alongside your code"
        description: "Combine Markdown guides with API documentation. Link across packages without stitching sites together."
        path: "guide/authoring.html"
      - title: "Examples that run"
        description: "Execute QMD cells and verify API examples with native runtimes, then publish their results."
        path: "guide/execution.html"
      - title: "Preview as you write"
        description: "Check your sources, preview changes locally, and build a static site ready to publish."
        path: "guide/quick-start.html"
  logo:
    repository: "diplodocus"
    path: "assets/brand/diplodocus-logo-large.png"
  open-graph:
    repository: "diplodocus"
    path: "assets/brand/og.png"
    alt: "Diplodocus: Polyglot documentation for monorepos. A dinosaur writes in an open book."
  footer:
    docs-version: "dev"
    copyright: "© 2026 Johan Larsson"
    licenses:
      - label: "MIT"
        url: "https://github.com/jolars/diplodocus/blob/main/LICENSE-MIT"
      - label: "Apache-2.0"
        url: "https://github.com/jolars/diplodocus/blob/main/LICENSE-APACHE"
    links:
      - label: "GitHub"
        url: "https://github.com/jolars/diplodocus"
      - label: "Report an issue"
        url: "https://github.com/jolars/diplodocus/issues"
    built-with: true
repositories:
  - id: "diplodocus"
    path: "."
    url: "https://github.com/jolars/diplodocus"
content:
  - id: "home"
    owner: "project"
    repository: "diplodocus"
    path: "docs/home"
    mount: ""
    format: "gfm"
  - id: "guide"
    owner: "project"
    repository: "diplodocus"
    path: "docs/guide"
    mount: "guide"
    format: "gfm"
  - id: "reference"
    owner: "project"
    repository: "diplodocus"
    path: "docs/reference"
    mount: "reference"
    format: "gfm"
  - id: "examples"
    owner: "project"
    repository: "diplodocus"
    path: "docs/examples"
    mount: "examples"
    format: "qmd"
    execution:
      mode: "execute"
      engine: "jupyter"
      kernel: "python3"
      declared-environment-inputs:
        - "devenv.lock"
  - id: "changelog"
    owner: "project"
    repository: "diplodocus"
    path: "CHANGELOG.md"
    mount: "reference"
    format: "gfm"
  - id: "contributing"
    owner: "project"
    repository: "diplodocus"
    path: "CONTRIBUTING.md"
    mount: "reference"
    format: "gfm"
