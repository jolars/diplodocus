project:
  name: "Tiny Stats"
repositories:
  - id: "tinystats"
    path: "packages"
packages:
  - id: "pystats"
    name: "Tiny Stats for Python"
    slug: "python"
    ecosystem: "python"
    repository: "tinystats"
    path: "python"
    metadata-path: "pyproject.toml"
    targets:
      - id: "api"
        extractor: "python"
        path: "src/tinystats"
        role: "public-api"
  - id: "rstats"
    name: "Tiny Stats for R"
    slug: "r"
    ecosystem: "r"
    repository: "tinystats"
    path: "r"
    metadata-path: "DESCRIPTION"
    targets:
      - id: "api"
        extractor: "r"
        path: "."
        role: "public-api"
  - id: "juliastats"
    name: "Tiny Stats for Julia"
    slug: "julia"
    ecosystem: "julia"
    repository: "tinystats"
    path: "julia"
    metadata-path: "Project.toml"
    targets:
      - id: "api"
        extractor: "julia"
        path: "src/TinyStats.jl"
        role: "public-api"
  - id: "ruststats"
    name: "Tiny Stats for Rust"
    slug: "rust"
    ecosystem: "rust"
    repository: "tinystats"
    path: "rust"
    metadata-path: "Cargo.toml"
    targets:
      - id: "api"
        extractor: "rust"
        path: "src/lib.rs"
        role: "public-api"
concepts:
  - id: "mean-squared-error"
    kind: "equivalent"
    members:
      - package: "pystats"
        item: "tinystats.mean_squared_error"
      - package: "rstats"
        item: "mean_squared_error"
      - package: "juliastats"
        item: "TinyStats.mean_squared_error"
      - package: "ruststats"
        item: "tinystats::mean_squared_error"
