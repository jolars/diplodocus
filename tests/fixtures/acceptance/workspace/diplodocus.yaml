project:
  name: "Foo"
repositories:
  - id: "core"
    path: "../core"
    url: "https://github.com/example/foo-core"
  - id: "python"
    path: "../python"
    url: "https://github.com/example/foo-python"
  - id: "r"
    path: "../r"
    url: "https://github.com/example/foo-r"
packages:
  - id: "pyfoo"
    name: "Foo for Python"
    slug: "python"
    ecosystem: "python"
    repository: "python"
    path: "."
    metadata-path: "pyproject.toml"
    targets:
      - id: "api"
        extractor: "python"
        path: "python/foo"
        role: "public-api"
  - id: "rfoo"
    name: "Foo for R"
    slug: "r"
    ecosystem: "r"
    repository: "r"
    path: "."
    metadata-path: "DESCRIPTION"
    targets:
      - id: "api"
        extractor: "r"
        path: "."
        role: "public-api"
content:
  - id: "guide"
    owner: "project"
    repository: "core"
    path: "docs"
    mount: "guide"
    format: "gfm"
    execution:
      mode: "never"
  - id: "python-guide"
    owner: "pyfoo"
    repository: "python"
    path: "docs"
    mount: "guide"
    format: "qmd"
    execution:
      mode: "never"
  - id: "python-default-never"
    owner: "pyfoo"
    repository: "python"
    path: "safety"
    mount: "safety"
    format: "qmd"
  - id: "python-execution"
    owner: "pyfoo"
    repository: "python"
    path: "execution"
    mount: "execution"
    format: "qmd"
    execution:
      mode: "execute"
      engine: "jupyter"
      kernel: "python3"
      declared-environment-inputs:
        - "pyproject.toml"
  - id: "r-execution"
    owner: "rfoo"
    repository: "r"
    path: "execution"
    mount: "execution"
    format: "qmd"
    execution:
      mode: "execute"
      engine: "jupyter"
      kernel: "ir"
      declared-environment-inputs:
        - "DESCRIPTION"
relationships:
  - from: "pyfoo"
    to: "cargo:foo-core"
    kind: "binds"
    version-constraint: "^1.9"
    provenance: "explicit"
concepts:
  - id: "fit"
    kind: "equivalent"
    members:
      - package: "pyfoo"
        item: "foo.fit"
      - package: "rfoo"
        item: "fit"
  - id: "foo-model.fit"
    kind: "analogous"
    members:
      - package: "pyfoo"
        item: "foo.FooModel.fit"
      - package: "rfoo"
        item: "fit.foo_model"
