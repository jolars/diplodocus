project:
  name: "Julia acceptance"
repositories:
  - id: "repo"
    path: "."
packages:
  - id: "geometry"
    name: "Tiny Geometry"
    slug: "julia"
    ecosystem: "julia"
    repository: "repo"
    path: "."
    metadata-path: "Project.toml"
    targets:
      - id: "api"
        extractor: "julia"
        path: "src/TinyGeometry.jl"
        role: "public-api"
content:
  - id: "guide"
    owner: "project"
    repository: "repo"
    path: "docs"
    mount: ""
    format: "gfm"
    execution:
      mode: "never"
