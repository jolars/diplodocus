[package]
name = "diplodocus"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["Johan Larsson <johan@jolars.co>"]
description = "Build coherent documentation websites for polyglot software projects."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jolars/diplodocus"
homepage = "https://github.com/jolars/diplodocus"
documentation = "https://docs.rs/diplodocus"
readme = "README.md"
keywords = ["documentation", "generator", "python", "r", "static-site"]
categories = ["command-line-utilities", "development-tools"]
default-run = "diplodocus"

[lib]
name = "diplodocus"
path = "src/lib.rs"

[[bin]]
name = "diplodocus"
path = "src/main.rs"

[dependencies]
arity-parser = "=0.6.0"
base64 = "=0.22.1"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
html5ever = "=0.39.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
jupyter-protocol = "=2.0.2"
jupyter-zmq-client = { version = "=1.0.1", features = ["tokio-runtime"] }
markup5ever_rcdom = "=0.39.0"
panache-parser = "=0.29.2"
percent-encoding = "=2.3.2"
png = "=0.18.1"
pydocstring = "=0.4.1"
pyproject-toml = "=0.13.7"
rd-ast = { version = "=0.4.0", default-features = false }
rd-source = "=0.4.0"
roxmltree = "=0.21.1"
ruff_python_ast = "=0.0.14"
ruff_python_parser = "=0.0.14"
ruff_text_size = "=0.0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
svgtypes = "=0.16.1"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.36", features = ["fs", "macros", "net", "process", "rt", "sync", "time"] }
toml = "=1.1.6"
url = "=2.5.8"
zune-core = "=0.5.3"
zune-jpeg = "=0.5.15"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
jupyter-zmq-client = { version = "=1.0.1", features = ["test-kernel"] }
snapbox = { version = "1.2", features = ["cmd", "dir"] }
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "signal", "time"] }

[build-dependencies]
toml = "=1.1.6"
