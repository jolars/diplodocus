[package]
name = "diplodocus"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["Johan Larsson <johan@jolars.co>"]
description = "Build coherent documentation websites for polyglot software projects."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jolars/diplodocus"
homepage = "https://github.com/jolars/diplodocus"
documentation = "https://docs.rs/diplodocus"
readme = "README.md"
keywords = ["documentation", "generator", "python", "r", "static-site"]
categories = ["command-line-utilities", "development-tools"]
default-run = "diplodocus"

[lib]
name = "diplodocus"
path = "src/lib.rs"

[[bin]]
name = "diplodocus"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
panache-parser = "=0.29.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
arity-parser = "=0.6.0"
jupyter-protocol = "=2.0.2"
jupyter-zmq-client = { version = "=1.0.1", features = ["test-kernel"] }
pydocstring = "=0.4.1"
pyproject-toml = "=0.13.7"
rd-ast = { version = "=0.4.0", default-features = false }
rd-source = "=0.4.0"
ruff_python_ast = "=0.0.12"
ruff_python_parser = "=0.0.12"
ruff_text_size = "=0.0.12"
serde_json = "1.0"
snapbox = { version = "1.2", features = ["cmd", "dir"] }
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "time"] }
