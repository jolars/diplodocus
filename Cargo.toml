[package]
name = "diplodocus"
version = "0.9.0"
edition = "2024"
rust-version = "1.98.0"
authors = ["Johan Larsson <johan@jolars.co>"]
description = "Build coherent documentation websites for polyglot software projects."
license = "MIT OR Apache-2.0"
repository = "https://github.com/jolars/diplodocus"
homepage = "https://github.com/jolars/diplodocus"
documentation = "https://docs.rs/diplodocus"
readme = "README.md"
keywords = ["documentation", "generator", "python", "r", "static-site"]
categories = ["command-line-utilities", "development-tools"]
default-run = "diplodocus"

[lib]
name = "diplodocus"
path = "src/lib.rs"

[[bin]]
name = "diplodocus"
path = "src/main.rs"

[dependencies]
arity-parser = "=0.6.1"
base64 = "=0.23.1"
clap = { version = "4.5", features = ["derive"] }
fatou-parser = "=0.8.2"
getrandom = "0.4"
# RcDom implements TreeSink only for this html5ever release line.
html5ever = "=0.39.0"
hayagriva = "=0.10.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
jupyter-protocol = "=2.0.3"
jupyter-zmq-client = { version = "=2.0.0", features = ["tokio-runtime"] }
katex = { package = "katex-rs", version = "=0.3.0", default-features = false }
markup5ever_rcdom = "=0.39.0"
panache-parser = "=0.34.0"
pep440_rs = "=0.7.3"
percent-encoding = "=2.3.2"
png = "=0.18.1"
pydocstring = "=0.4.1"
pyproject-toml = "=0.13.7"
rd-ast = { version = "=0.5.0", default-features = false }
rd-source = "=0.5.0"
rd-rds = { version = "=0.5.0", default-features = false, features = ["lazyload"] }
regex = "1.12"
roxmltree = "=0.21.1"
rowan = "=0.17.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
ruff_python_ast = "=0.0.19"
ruff_python_parser = "=0.0.19"
ruff_text_size = "=0.0.19"
rustdoc-types = "=0.61.0"
serde = { version = "1.0", features = ["derive"] }
semver = "=1.0.28"
serde_json = "1.0"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize", "serialize"] }
sha2 = "0.11"
svgtypes = "=0.16.1"
syntect = { version = "=5.3.0", default-features = false, features = ["html", "regex-fancy"] }
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.36", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time", "signal", "io-util"] }
toml = "=1.1.8"
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
url = "=2.5.8"
zune-core = "=0.5.3"
zune-jpeg = "=0.5.15"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
jupyter-zmq-client = { version = "=2.0.0", features = ["test-kernel"] }
snapbox = { version = "1.2", features = ["cmd", "dir"] }
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "signal", "time"] }

[build-dependencies]
clap = { version = "4.5", features = ["derive"] }
clapdown = "=0.3.0"
toml = "=1.1.8"

[profile.dist]
inherits = "release"
lto = "thin"

[profile.test]
debug = "line-tables-only"

# Execution identity checks hash executables even when page results are cached.
[profile.test.package.sha2]
opt-level = 3
