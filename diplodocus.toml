[project]
name = "Diplodocus"

[presentation]
description = "Guides for building Python and R documentation with Diplodocus."
site-url = "https://diplodocus.cc/"
canonical-url-style = "clean"

[[repository]]
id = "diplodocus"
path = "."
url = "https://github.com/jolars/diplodocus"

[[content]]
id = "guide"
owner = "project"
repository = "diplodocus"
path = "docs/guide"
mount = ""
format = "gfm"

[[content]]
id = "examples"
owner = "project"
repository = "diplodocus"
path = "docs/examples"
mount = "examples"
format = "qmd"

[content.execution]
mode = "execute"
engine = "jupyter"
kernel = "python3"
declared-environment-inputs = ["devenv.lock"]
