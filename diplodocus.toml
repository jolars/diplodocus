[project]
name = "Diplodocus"

[presentation]
description = "Guides for building Python, R, Julia, and Rust documentation with Diplodocus."
site-url = "https://diplodocus.cc/"
canonical-url-style = "clean"

[presentation.home]
tagline = "Four languages.\nOne home for docs."
description = "Bring your Python, R, Julia, and Rust packages together. Build API references and guides with shared navigation, cross-references, and search."
guide = "guide/index.html"
actions = [
  { label = "Get started", path = "guide/quick-start.html" },
  { label = "Explore the guide", path = "guide/index.html" },
]
features = [
  { title = "Four languages, one home", description = "Keep related packages together, with API references extracted from Python, R, Julia, and Rust.", path = "guide/extraction.html" },
  { title = "Write alongside your code", description = "Combine Markdown guides with API documentation. Link across packages without stitching sites together.", path = "guide/authoring.html" },
  { title = "Examples that run", description = "Execute QMD cells and verify API examples with native runtimes, then publish their results.", path = "guide/execution.html" },
  { title = "Build once, publish anywhere", description = "Save a portable snapshot. Generate a static site or bring your own frontend, without the source checkout.", path = "guide/snapshots.html" },
]

[presentation.logo]
repository = "diplodocus"
path = "assets/brand/diplodocus-logo-large.png"

[presentation.open-graph]
repository = "diplodocus"
path = "assets/brand/og.png"
alt = "Diplodocus: Polyglot documentation for monorepos. A dinosaur writes in an open book."

[presentation.footer]
docs-version = "dev"
copyright = "© 2026 Johan Larsson"
licenses = [
  { label = "MIT", url = "https://github.com/jolars/diplodocus/blob/main/LICENSE-MIT" },
  { label = "Apache-2.0", url = "https://github.com/jolars/diplodocus/blob/main/LICENSE-APACHE" },
]
links = [
  { label = "GitHub", url = "https://github.com/jolars/diplodocus" },
  { label = "Report an issue", url = "https://github.com/jolars/diplodocus/issues" },
]
built-with = true

[[repository]]
id = "diplodocus"
path = "."
url = "https://github.com/jolars/diplodocus"

[[content]]
id = "guide"
owner = "project"
repository = "diplodocus"
path = "docs/guide"
mount = "guide"
format = "gfm"

[[content]]
id = "examples"
owner = "project"
repository = "diplodocus"
path = "docs/examples"
mount = "examples"
format = "qmd"

[content.execution]
mode = "execute"
engine = "jupyter"
kernel = "python3"
declared-environment-inputs = ["devenv.lock"]
