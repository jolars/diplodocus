[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tinystats"
version = "0.1.0"
description = "A small Python package for the Diplodocus monorepo example."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tiny Stats contributors" }]

[project.urls]
Website = "https://github.com/jolars/diplodocus"
Issues = "https://github.com/jolars/diplodocus/issues"

[tool.setuptools.packages.find]
where = ["src"]
