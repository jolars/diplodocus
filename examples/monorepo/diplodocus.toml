[project]
name = "Tiny Stats"

[presentation]
description = "A shared guide and API reference for Tiny Stats in Python, R, and Julia."

[[repository]]
id = "tinystats"
path = "."

[[package]]
id = "pystats"
name = "Tiny Stats for Python"
slug = "python"
ecosystem = "python"
repository = "tinystats"
path = "python"
metadata-path = "pyproject.toml"
targets = [
  { id = "api", extractor = "python", path = "src/tinystats", role = "public-api" },
]

[[package]]
id = "rstats"
name = "Tiny Stats for R"
slug = "r"
ecosystem = "r"
repository = "tinystats"
path = "r"
metadata-path = "DESCRIPTION"
targets = [
  { id = "api", extractor = "r", path = ".", role = "public-api" },
]

[[package]]
id = "juliastats"
name = "Tiny Stats for Julia"
slug = "julia"
ecosystem = "julia"
repository = "tinystats"
path = "julia"
metadata-path = "Project.toml"
targets = [
  { id = "api", extractor = "julia", path = "src/TinyStats.jl", role = "public-api" },
]

[[content]]
id = "guide"
owner = "project"
repository = "tinystats"
path = "docs"
mount = ""
format = "gfm"

[content.execution]
mode = "never"

[[content]]
id = "python-guide"
owner = "pystats"
repository = "tinystats"
path = "python/docs"
mount = "guides"
format = "gfm"

[content.execution]
mode = "never"

[[concept]]
id = "mean-squared-error"
kind = "equivalent"
members = [
  { package = "pystats", item = "tinystats.mean_squared_error" },
  { package = "rstats", item = "mean_squared_error" },
  { package = "juliastats", item = "TinyStats.mean_squared_error" },
]

