[project]
name = "Tiny Stats"

[presentation]
description = "A shared guide and API reference for Tiny Stats in Python, R, Julia, and Rust."

[presentation.home]
tagline = "Small metrics.\nClearer predictions."
description = "Evaluate numeric predictions in Python, R, Julia, and Rust. Learn the metrics once, then use the same six operations in the language you know."
guide = "overview.html"
actions = [
  { label = "Get started", path = "getting-started/quick-start.html" },
  { label = "Explore the guide", path = "overview.html" },
]
features = [
  { title = "One API, four languages", description = "Use the same six operations in Python, R, Julia, and Rust. Each reference links to its counterparts in the other languages.", path = "packages/python/index.html" },
  { title = "Comparing predictions", description = "Work through squared error by hand, then calculate it with the same observations and predictions in each language.", path = "guides/comparing-predictions.html" },
  { title = "Choosing a metric", description = "Compare error magnitude, bias, and R squared. Choose the score that answers your question.", path = "guides/choosing-a-metric.html" },
  { title = "Inspecting residuals", description = "Look beyond a single score. Inspect individual errors to see which predictions need a closer look.", path = "guides/inspecting-residuals.html" },
]

[presentation.logo]
repository = "tinystats"
path = "docs/assets/logo.svg"

[presentation.footer]
docs-version = "dev"
copyright = "© 2026 Johan Larsson"
licenses = [
  { label = "MIT", url = "https://github.com/jolars/diplodocus/blob/main/LICENSE-MIT" },
  { label = "Apache-2.0", url = "https://github.com/jolars/diplodocus/blob/main/LICENSE-APACHE" },
]
links = [
  { label = "GitHub", url = "https://github.com/jolars/diplodocus" },
  { label = "Report an issue", url = "https://github.com/jolars/diplodocus/issues" },
]
built-with = true

[[repository]]
id = "tinystats"
path = "."
url = "https://github.com/jolars/diplodocus"

[[package]]
id = "pystats"
name = "Tiny Stats for Python"
slug = "python"
ecosystem = "python"
repository = "tinystats"
path = "python"
metadata-path = "pyproject.toml"
targets = [
  { id = "api", extractor = "python", path = "src/tinystats", role = "public-api" },
]

[[package]]
id = "rstats"
name = "Tiny Stats for R"
slug = "r"
ecosystem = "r"
repository = "tinystats"
path = "r"
metadata-path = "DESCRIPTION"
targets = [
  { id = "api", extractor = "r", path = ".", role = "public-api" },
]

[[package]]
id = "juliastats"
name = "Tiny Stats for Julia"
slug = "julia"
ecosystem = "julia"
repository = "tinystats"
path = "julia"
metadata-path = "Project.toml"
targets = [
  { id = "api", extractor = "julia", path = "src/TinyStats.jl", role = "public-api" },
]

[[package]]
id = "ruststats"
name = "Tiny Stats for Rust"
slug = "rust"
ecosystem = "rust"
repository = "tinystats"
path = "rust"
metadata-path = "Cargo.toml"
targets = [
  { id = "api", extractor = "rust", path = "src/lib.rs", role = "public-api" },
]

[[content]]
id = "guide"
owner = "project"
repository = "tinystats"
path = "docs"
mount = ""
format = "gfm"

[content.execution]
mode = "never"

[[content]]
id = "python-guide"
owner = "pystats"
repository = "tinystats"
path = "python/docs"
mount = "guides"
format = "gfm"

[content.execution]
mode = "never"

[[concept]]
id = "mean-squared-error"
kind = "equivalent"
members = [
  { package = "pystats", item = "tinystats.mean_squared_error" },
  { package = "rstats", item = "mean_squared_error" },
  { package = "juliastats", item = "TinyStats.mean_squared_error" },
  { package = "ruststats", item = "tinystats::mean_squared_error" },
