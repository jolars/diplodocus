name = "diplodocus-docs"
compatibility_date = "2026-10-06"
workers_dev = false
main = "./site/docs/__diplodocus/worker.js"

[assets]
binding = "ASSETS"
run_worker_first = true
directory = "./site/docs"

[[routes]]
pattern = "diplodocus.cc"
custom_domain = true

[observability]
enabled = true

[observability.traces]
enabled = true
